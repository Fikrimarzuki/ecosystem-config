    <script>
      // Apply the saved theme and language before first paint. Storage may be unavailable.
      (function () {
        var d = document.documentElement, theme = null, lang = null;
        try { theme = localStorage.getItem("ec.theme"); lang = localStorage.getItem("ec.lang"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (lang !== "en" && lang !== "id") lang = (navigator.language || "").toLowerCase().indexOf("id") === 0 ? "id" : "en";
        d.setAttribute("data-theme", theme); d.setAttribute("lang", lang);
      })();
    </script>

        and the guides are readable on <a href="https://github.com/Fikrimarzuki/ecosystem-config/tree/main/docs">GitHub</a>.
      </p>
